# OpenTelemetry Collector — configuration de développement.
# En production : rétention minimisée, redaction renforcée, accès restreint
# (threat-model-v2 TV-12).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
  # Défense en profondeur : supprime les attributs susceptibles de porter du
  # contenu sensible même si l'application ne devrait jamais les émettre.
  attributes/redact:
    actions:
      - key: db.statement
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: net.peer.name
        action: delete

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
