name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend tests scripts ml

      - name: Type check (mypy)
        run: mypy backend

      - name: Compile
        run: python -m compileall -q backend tests scripts ml

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Coverage (gate at 85%)
        run: |
          coverage run -m unittest discover -s tests
          coverage report

      - name: SAST (bandit)
        run: bandit -r backend scripts -q

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit

      - name: Secret scan
        run: python scripts/scan_secrets.py

      - name: OpenAPI spec validity
        run: python scripts/validate_openapi.py
