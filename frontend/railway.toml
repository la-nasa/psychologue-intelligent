[build]
builder = "RAILPACK"

[deploy]
# Explicite plutôt que de laisser Railpack déduire la commande : le premier
# déploiement restait silencieux après "Starting Container" (aucun log Next.js),
# symptôme d'une commande de démarrage/port ambigus sur ce builder.
startCommand = "npm run start -- -p 3000 -H 0.0.0.0"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
