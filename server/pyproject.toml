[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psychologue-intelligent-server"
version = "0.2.0"
description = "Psychologue Intelligent V2 — API (FastAPI, monolithe modulaire)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.4",          # driver sync pour Alembic
    "redis==8.1.0",
    "aio-pika==10.0.1",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",            # remplace PBKDF2 de la v1 (ADR-006 / threat-model-v2 TH-01)
    "cryptography==50.0.1",           # chiffrement applicatif par champ (data-model-v2 §1)
    "pyjwt==2.13.0",
    "structlog==26.1.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "coverage==7.16.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF", "ASYNC", "S"]
# S101 (assert) autorisé dans les tests ; E501 géré par le formateur
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603"]
"app/alembic/**" = ["E402", "F401"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
# disallow_untyped_defs sera activé en Phase 2 une fois la base stabilisée sous
# `docker compose` ; check_untyped_defs vérifie déjà le corps des fonctions.
exclude = ["app/alembic/versions"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "app/main.py"]

[tool.coverage.report]
fail_under = 85
skip_covered = false
